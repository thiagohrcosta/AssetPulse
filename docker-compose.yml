services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: asset_pulse_api_development
    volumes:
      - asset_pulse_db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./asset-pulse-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Only needed if config/master.key isn't present on disk (e.g. CI).
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./asset-pulse-api:/rails
      - asset_pulse_bundle_cache:/usr/local/bundle
      - asset_pulse_rails_tmp:/rails/tmp

  # web:
  #   build:
  #     context: ./asset-pulse-web
  #     dockerfile: Dockerfile.dev
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3000}
  #   ports:
  #     - "${WEB_PORT:-3001}:3000"
  #   volumes:
  #     - ./asset-pulse-web:/app
  #     - asset_pulse_web_node_modules:/app/node_modules

volumes:
  asset_pulse_db_data:
  asset_pulse_bundle_cache:
  asset_pulse_rails_tmp:
