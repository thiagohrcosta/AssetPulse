openapi: 3.0.1
info:
  title: AssetPulse API
  description: >
    Hand-written OpenAPI description of the `/api` endpoints in
    `app/controllers/api/**`. Not generated from specs (this app isn't using
    rswag-specs/RSpec) — keep this file in sync by hand when a controller's
    request/response shape changes.

    Import this file directly into Insomnia/Postman (Import > From File/URL),
    or browse it at `/api-docs` once the server is running.
  version: "1.0"
servers:
  - url: http://localhost:3000
    description: Local (docker compose)

tags:
  - name: Auth
  - name: Companies
  - name: Plans
  - name: Subscriptions
    description: >
      One subscription per company. `trial` starts a card-less 7-day trial;
      `checkout_session` hands back a Stripe Checkout URL for the Basic/Premium
      plans; `billing_portal` lets an already-paying company manage/cancel.
      Access is gated on Subscription#access_granted? (see app/models/subscription.rb).
  - name: Host Units
    description: >
      Vehicles/equipment owned by a fleet-operator company. Gated on the
      company having an active trial or subscription (see SubscriptionGate).
  - name: Parts
    description: >
      Serialized parts tracked through their lifecycle, scoped to a company.
      Gated on the company having an active trial or subscription.
  - name: Lifecycle Events
    description: >
      History entries (installed/maintenance/replaced/reassigned/scrapped) for
      a part, scoped to a company + part. Gated on the company having an
      active trial or subscription.
  - name: Part Type References
    description: >
      Catalog of trackable part categories (brake pad, battery, ...) and their
      typical lifespan. Read by any authenticated user; write actions
      (create/update/delete) require an admin user.
  - name: Stripe Webhooks
    description: Called by Stripe itself, not by API clients — included for completeness.
  - name: Health

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create a user and return a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirmation, full_name, document_number, address_zip_code, address_street, address_number, address_city, address_state]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, example: password123 }
                password_confirmation: { type: string, format: password, example: password123 }
                full_name: { type: string }
                document_number: { type: string, description: CPF/CNPJ, example: "12345678900" }
                address_zip_code: { type: integer, example: 12345678 }
                address_street: { type: string }
                address_number: { type: integer }
                address_city: { type: string }
                address_complement: { type: string, nullable: true }
                address_state: { type: string, example: SP }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange email/password for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/companies:
    get:
      tags: [Companies]
      summary: List the current user's companies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Companies]
      summary: Create a company owned by the current user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CompanyInput' }
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/companies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Companies]
      summary: Show a company
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Companies]
      summary: Update a company
      requestBody:
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CompanyInput' }
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Companies]
      summary: Delete a company
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/plans:
    get:
      tags: [Plans]
      summary: List active subscription plans (Basic / Premium with AI)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/companies/{company_id}/subscription:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Subscriptions]
      summary: Current subscription status for a company
      description: Returns `{"status":"none","access_granted":false}` if the company has never started a trial/subscription.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{company_id}/subscription/trial:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Subscriptions]
      summary: Start the card-less 7-day trial
      description: One trial per company — fails if the company already has a subscription (trial, active, or otherwise).
      responses:
        '201':
          description: Trial started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '422':
          description: Company already has a subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/companies/{company_id}/subscription/checkout_session:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Subscriptions]
      summary: Create a Stripe Checkout session for a paid plan
      description: >
        Creates (or reuses) the company's Stripe Customer, then a Checkout
        Session in subscription mode for the given plan. Redirect the browser
        to the returned `checkout_url`; the local Subscription row is written
        by the `checkout.session.completed` webhook once payment succeeds,
        not by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_slug]
              properties:
                plan_slug: { type: string, enum: [basic, premium], example: basic }
                success_url: { type: string, format: uri, description: "Defaults to STRIPE_CHECKOUT_SUCCESS_URL." }
                cancel_url: { type: string, format: uri, description: "Defaults to STRIPE_CHECKOUT_CANCEL_URL." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url: { type: string, format: uri }
        '422':
          description: Unknown plan_slug
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/companies/{company_id}/subscription/billing_portal:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Subscriptions]
      summary: Create a Stripe billing portal session
      description: Only works once the company has a Stripe customer (i.e. after a checkout_session has run at least once).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_url: { type: string, format: uri, description: "Defaults to STRIPE_CHECKOUT_CANCEL_URL." }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  portal_url: { type: string, format: uri }
        '422':
          description: Company has no billing account yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/companies/{company_id}/host_units:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Host Units]
      summary: List the company's host units
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HostUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Host Units]
      summary: Create a host unit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostUnitInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostUnit' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{company_id}/host_units/{id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Host Units]
      summary: Show a host unit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Host Units]
      summary: Update a host unit
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostUnitInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostUnit' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Host Units]
      summary: Delete a host unit
      description: Parts installed on this host unit are not deleted — their host_unit_id is set to null.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{company_id}/parts:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Parts]
      summary: List the company's parts
      parameters:
        - name: host_unit_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [installed, in_repair, removed, scrapped] }
        - name: part_type_reference_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Part' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Parts]
      summary: Create a part
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Part' }
        '422':
          description: Validation failed, or host_unit_id belongs to another company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{company_id}/parts/{id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Parts]
      summary: Show a part
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Part' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Parts]
      summary: Update a part
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Part' }
        '422':
          description: Validation failed, or host_unit_id belongs to another company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Parts]
      summary: Delete a part
      description: "Also deletes the part's lifecycle_events (dependent: :destroy)."
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{company_id}/parts/{part_id}/lifecycle_events:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
      - name: part_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Lifecycle Events]
      summary: List a part's lifecycle events, chronologically
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LifecycleEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Lifecycle Events]
      summary: Record a lifecycle event for a part
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleEventInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleEvent' }
        '422':
          description: Validation failed, or host_unit_id belongs to another company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/companies/{company_id}/parts/{part_id}/lifecycle_events/{id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema: { type: integer }
      - name: part_id
        in: path
        required: true
        schema: { type: integer }
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Lifecycle Events]
      summary: Show a lifecycle event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lifecycle Events]
      summary: Update a lifecycle event
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LifecycleEventInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LifecycleEvent' }
        '422':
          description: Validation failed, or host_unit_id belongs to another company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Lifecycle Events]
      summary: Delete a lifecycle event
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/part_type_references:
    get:
      tags: [Part Type References]
      summary: List the part type catalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PartTypeReference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Part Type References]
      summary: Add a part type to the catalog
      description: Admin only (User#access == "admin").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartTypeReferenceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartTypeReference' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/part_type_references/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Part Type References]
      summary: Show a part type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartTypeReference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Part Type References]
      summary: Update a part type
      description: Admin only (User#access == "admin").
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartTypeReferenceInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartTypeReference' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Errors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Part Type References]
      summary: Delete a part type
      description: Admin only. Fails if any part still references this type (restrict_with_error).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Parts still reference this type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/stripe/webhooks:
    post:
      tags: [Stripe Webhooks]
      summary: Stripe event delivery endpoint
      description: >
        Not for manual/API-client use — Stripe calls this with a signed
        payload (see app/controllers/api/v1/stripe/webhooks_controller.rb).
        Authenticity comes entirely from the `Stripe-Signature` header, not a
        bearer token.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Raw Stripe::Event payload" }
      responses:
        '200': { description: Processed }
        '400':
          description: Missing/invalid signature or unparsable payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { description: "Handler raised while processing an otherwise-valid event" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Send the token from register/login as: `Authorization: Bearer <token>`'

  responses:
    Unauthorized:
      description: Missing/invalid/expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (or not owned by the current user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentRequired:
      description: Trial expired and no active subscription (SubscriptionGate)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              subscription_status: { type: string, example: none }
    Forbidden:
      description: Authenticated, but not an admin user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Errors:
      type: object
      properties:
        errors:
          type: array
          items: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        full_name: { type: string }
        document_number: { type: string }
        address_zip_code: { type: integer }
        address_street: { type: string }
        address_number: { type: integer }
        address_city: { type: string }
        address_complement: { type: string, nullable: true }
        address_state: { type: string }
        access: { type: string, enum: [user, admin, company_admin] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompanyInput:
      type: object
      required: [name, registration_number, address_zip_code, address_street, address_number, address_city, address_state]
      properties:
        name: { type: string }
        registration_number: { type: string, description: CNPJ, example: "12345678000199" }
        address_zip_code: { type: integer }
        address_street: { type: string }
        address_number: { type: integer }
        address_city: { type: string }
        address_complement: { type: string, nullable: true }
        address_state: { type: string, example: SP }
        logo: { type: string, format: binary, description: "PNG/JPEG/WEBP, max 5MB" }

    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        registration_number: { type: string }
        address_zip_code: { type: integer }
        address_street: { type: string }
        address_number: { type: integer }
        address_city: { type: string }
        address_complement: { type: string, nullable: true }
        address_state: { type: string }
        logo_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string, enum: [basic, premium] }
        name: { type: string, example: "Premium with AI" }
        amount_cents: { type: integer, example: 8999 }
        amount: { type: number, format: float, example: 89.99 }
        currency: { type: string, example: usd }
        interval: { type: string, example: month }
        ai_enabled: { type: boolean }

    Subscription:
      type: object
      description: "`{\"status\":\"none\",\"access_granted\":false}` when the company has no subscription record yet."
      properties:
        id: { type: integer, nullable: true }
        status:
          type: string
          enum: [none, trialing, active, past_due, unpaid, canceled, incomplete, incomplete_expired]
        plan: { type: string, nullable: true, description: "Plan slug, or null during trial", example: basic }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        current_period_end: { type: string, format: date-time, nullable: true }
        cancel_at_period_end: { type: boolean }
        access_granted: { type: boolean, description: "See Subscription#access_granted? — whether the platform should let this company in." }

    HostUnitInput:
      type: object
      required: [vin, description]
      properties:
        vin: { type: string, minLength: 17, maxLength: 17, example: "1HGCM82633A004352" }
        description: { type: string, example: "Toyota Corolla 2019" }

    HostUnit:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        vin: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PartInput:
      type: object
      required: [part_type_reference_id, serial_number, manufacturer, model]
      properties:
        part_type_reference_id: { type: integer }
        host_unit_id: { type: integer, nullable: true, description: "Must belong to the same company. Null if not currently installed." }
        serial_number: { type: string, example: "BP-BSH-000123" }
        manufacturer: { type: string, example: Bosch }
        model: { type: string, example: "BO-042" }
        status: { type: string, enum: [installed, in_repair, removed, scrapped], default: installed }

    Part:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        host_unit_id: { type: integer, nullable: true }
        part_type_reference_id: { type: integer }
        serial_number: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        status: { type: string, enum: [installed, in_repair, removed, scrapped] }
        part_type: { type: string, description: "Delegated from part_type_reference", example: brake_pad }
        typical_lifespan_days: { type: integer, description: "Delegated from part_type_reference" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LifecycleEventInput:
      type: object
      required: [event_type, occurred_at, age_at_event_days]
      properties:
        event_type:
          type: string
          enum: [installed, maintenance, replaced_wear, replaced_defect, reassigned, scrapped]
        installation_type:
          type: string
          nullable: true
          enum: [factory_original, aftermarket_new, aftermarket_refurbished]
        occurred_at: { type: string, format: date-time }
        age_at_event_days: { type: integer, minimum: 0, description: "Continuous days in service since the part's current life cycle started." }
        notes: { type: string, nullable: true }
        host_unit_id: { type: integer, nullable: true, description: "Must belong to the same company. Null once the part is no longer installed anywhere." }

    LifecycleEvent:
      type: object
      properties:
        id: { type: integer }
        part_id: { type: integer }
        host_unit_id: { type: integer, nullable: true }
        company_id: { type: integer }
        event_type:
          type: string
          enum: [installed, maintenance, replaced_wear, replaced_defect, reassigned, scrapped]
        installation_type:
          type: string
          nullable: true
          enum: [factory_original, aftermarket_new, aftermarket_refurbished]
        occurred_at: { type: string, format: date-time }
        age_at_event_days: { type: integer }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PartTypeReferenceInput:
      type: object
      required: [part_type, typical_lifespan_days]
      properties:
        part_type:
          type: string
          enum: [brake_pad, brake_rotor, battery, alternator, spark_plug, air_filter, oil_filter, tire, water_pump, shock_absorber]
        typical_lifespan_days: { type: integer, minimum: 1, example: 545 }

    PartTypeReference:
      type: object
      properties:
        id: { type: integer }
        part_type: { type: string }
        typical_lifespan_days: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
